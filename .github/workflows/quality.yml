
name: Diorama quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diorama-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate module graph and syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Run static security audit
        run: npm run security
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: diorama-dist
          path: dist/
          if-no-files-found: error

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium, Firefox and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Build and run cross-browser smoke tests
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diorama-browser-smoke
          path: browser-artifacts/
          if-no-files-found: warn
