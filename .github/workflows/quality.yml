name: Diorama quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: diorama-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate module graph and syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Run static security audit
        run: npm run security
      - name: Validate Cloudflare Worker bundle without deploying
        if: github.ref == 'refs/heads/migration/cloudflare-pages'
        run: npx --yes wrangler@4.162.0 deploy --dry-run --outdir .wrangler-cloudflare-dry-run
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: diorama-dist
          path: dist/
          if-no-files-found: error

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build and run Chromium smoke tests
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diorama-browser-smoke
          path: browser-artifacts/
          if-no-files-found: warn
