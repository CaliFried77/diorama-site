name = 'diorama-site'
main = "cloudflare/worker.mjs"
compatibility_date = "2026-11-15"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[ratelimits]]
name = "NEWS_RATE_LIMITER"
namespace_id = "271120261501"

[ratelimits.simple]
limit = 40
period = 60

[[ratelimits]]
name = "CUSTOM_NEWS_RATE_LIMITER"
namespace_id = "271120261502"

[ratelimits.simple]
limit = 40
period = 60
